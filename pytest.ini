[pytest]
testpaths =
    oceano/get_datasets/
    oceano/meta_finder/
    oceano/tcm/
    shared/veusz_helpers/
    tests/
addopts = --import-mode importlib -m "not clipboard"
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    calibration: calibration math tests
    clipboard: writes the REAL OS clipboard (pollutes clipboard-manager history); deselected by default, run explicitly with -m clipboard
    gui: instantiates Tk widgets (requires a display)
    legacy: legacy pipeline tests
