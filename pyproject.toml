[project]
description = "Monorepo for oceanology projects"
authors = [{name = "Andrey Korzh", email = "ao.korzh@gmail.com"}]
name = "absioras"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = [
"hydra-colorlog>=1.2",
"ruamel-yaml>=0.19.1"
]


[tool.hatch.workspace]
members = [
    "oceano/*",
    "shared/*"
]

[tool.hatch.build.targets.wheel]
packages = [
"oceano/adcp",
"oceano/gps_tracker",
"oceano/tcm",
"oceano/ctd",
"oceano/get_datasets",
"oceano/meta_finder",
"shared/utils",
"shared/hdf5_pandas",
"shared/hdf5_alt",
"shared/veusz_helpers",
"third_party/descartes",
"third_party/veusz",
"third_party/mne",
"third_party/wafo"
]


# workspace-level common dependencies kept minimal to avoid forcing heavy native libs
[tool.pixi.dependencies]
python = ">=3.11"
numpy = ">=1.24"
pandas = ">=2.1"
"hydra-core" = ">=1.3"
"hydra-colorlog" = ">=1.2"
"ruamel.yaml" = ">=0.18"
pywin32 = ">=306"
tqdm = ">=4.65"
pytest = ">=9.1.1,<10"

# Feature groups that opt-in heavy native or binary-optimized packages
[tool.pixi.feature.bin-optim.dependencies]
libblas = { version = "*", build = "*openblas*" }
libcblas = { version = "*", build = "*openblas*" }
liblapack = { version = "*", build = "*openblas*" }
h5py = ">=3.8"
netcdf4 = ">=1.6"
numba = "*"
flox = ">=0.11.2,<0.12"
numbagg = ">=0.9.4,<0.10"
scipy = ">=1.11"
xarray = ">=2026.7.0,<2027"
matplotlib = ">=3.2"


[tool.pixi.feature.noh5.dependencies]
# "No HDF5 native libs, minimal binary footprint for standalone CLI builds"
# Prevent runtime dispatch bug - removed `mkl = "*"` and added openblas:
libblas = { version = "*", build = "*openblas*" }
libcblas = { version = "*", build = "*openblas*" }
liblapack = { version = "*", build = "*openblas*" }
pyinstaller = "*"
pyinstaller-hooks-contrib = "*"

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-arraydiff = "*"
pytest-cov = "*"
pytest-mock = ">=3.15.1,<4"

[tool.pixi.feature.test.pypi-dependencies]
absioras-tcm = { path = "oceano/tcm", editable = true }

[tool.pixi.feature.legacy.dependencies]
dask = "*"
dask-funk = "*"
async-timeout = "*"
bokeh = "*"
webdriver-manager = "*"
selenium = "*"
# bqplot = "*"

[tool.pixi.feature.experimental.dependencies]
attrs = "*"
cvxpy = "*"
clize = "*"
frictionless = "*"
geopandas = "*"
# cachey = "*"

# Зависимости сервисов как features
[tool.pixi.feature.get_datasets.dependencies]
copernicusmarine = "*"
questionary = ">=2.1.1"
cdsapi = "*"
ftputil = "*"
cfgrib = "*"
json2html = "*"
requests = "*"
urllib3 = "*"
google-api-python-client = "*"
google-auth-oauthlib = "*"
# motuclient = "*"
# openssl = "*"

[tool.pixi.feature.get_datasets.pypi-dependencies]
absioras-get_datasets = { path = "oceano/get_datasets", editable = true }

[tool.pixi.feature.manage.pypi-dependencies]
absioras-meta_finder = { path = "oceano/meta_finder", editable = true }

[tool.pixi.feature.arc.dependencies]
libarchive = ">=3.8.6,<4"
python-libarchive-c = ">=5.3,<6"
# rarfile = "*"
# py7zr = "*"

[tool.pixi.feature.tcm.dependencies]
"dask-core" = ">=2024.4"
xarray = ">=2026.7.0,<2027"

[tool.pixi.feature.tcm.pypi-dependencies]
absioras-tcm = { path = "oceano/tcm", editable = true }
pygeomag = ">=1.1.0,<2"

[tool.pixi.feature.notebook.dependencies]
jupyterlab = "*"
jupyterlab-spellchecker = "*"
nb_conda = "*"
nbconvert = "*"
sympy = "*"
pixi-kernel = "*"
seaborn = "*"
matplotlib = ">=3.2"

[tool.pixi.feature.ocean.dependencies]
# blosc = "*"
# snappy = "*"
# colorlog = "*"
# pillow = "*"
chardet = "*"
dtale = "*"
gdal = "*"
gpxpy = "*"
gsw = "*"
h5py = ">=3.8"
hdf5 = "*"
hydra-core = "*"
lxml = "*"
matplotlib = ">=3.2"
more-itertools = "*"
netcdf4 = ">=1.6"
numpy = "<2.4"
numba = "*"
numexpr = "*"
pandas = "*"
progressbar2 = "*"
py = "*"
pyinstaller = "*"
pyinstaller-hooks-contrib = "*"
pynmea2 = "*"
pyproj = "*"
pyodbc = "*"
pyqt = "*"
pytables = ">=3.8"
pywavelets = "*"
pywin32 = "*"
qt = "*"
re2 = "*"
scikit-learn = "*"
scipy = ">=1.11"
shapely = "*"
sqlite = "*"
statsmodels = "*"
tabulate = "*"
toolz = "*"
tqdm = "*"
xarray = ">=2026.7.0,<2027"
astropy = "*"
wavespectra = ">=4.4.2"

[tool.pixi.feature.ocean.pypi-dependencies]
absioras-utils = { path = "shared/utils", editable = true }
absioras-hdf5_pandas = { path = "shared/hdf5_pandas", editable = true }
absioras-veusz_helpers = { path = "shared/veusz_helpers", editable = true }
absioras-hdf5_alt = { path = "shared/hdf5_alt", editable = true }
absioras-ctd = { path = "oceano/ctd", editable = true }
absioras-meta_finder = { path = "oceano/meta_finder", editable = true }
absioras-gps_tracker = { path = "oceano/gps_tracker", editable = true }
absioras-adcp = { path = "oceano/adcp", editable = true }
absioras-third_party-descartes = { path = "third_party/descartes", editable = true }
absioras-third_party-veusz = { path = "third_party/veusz", editable = true }
absioras-third_party-mne = { path = "third_party/mne", editable = true }
absioras-third_party-wafo = { path = "third_party/wafo", editable = true }


# Environments
[tool.pixi.environments]
dev = {features = [
    "ocean", "tcm", "notebook", "arc", "get_datasets", "legacy", "test"
    ], solve-group = "default" }
tcm = { features = ["tcm"], solve-group = "default" }
default = { features = ["ocean", "notebook", "arc", "get_datasets"], solve-group = "default" }
# legacy = { features = ["ocean", "notebook", "legacy"], solve-group = "default" }
exp= { features = ["experimental"], solve-group = "default" }
manage = { features = ["arc", "manage"], solve-group = "default" }
noh5 = { features = ["noh5"], solve-group = "noh5" }
noh5-tcm = { features = ["noh5", "tcm"], solve-group = "noh5" }
bin-optim-tcm = { features = ["noh5", "bin-optim", "tcm", "test"], solve-group = "noh5" }

[tool.pixi.tasks]
test = "pytest tests/"
test-all = "hatch run test:*"
start = "python oceano/tcm/scripts/tcm_clc.py"

[tool.pixi.tasks.build-tcm-clc-txt]
cmd = "python oceano/tcm/scripts/build/build_tcm_clc_txt.py"
env = { BUILD_MODE = "manual" }

[tool.pixi.tasks.build-tcm-clc-txt-auto]
cmd = "python oceano/tcm/scripts/build/build_tcm_clc_txt.py"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.ruff]
line-length = 110
target-version = "py312"
builtins = ["SetData", "SetData2D", "SetDataExpression", "SetData2DExpression", "SetData2DExpressionXYZ", "SetData2DXYFunc", "AddCustom", "DatasetPlugin", "TagDatasets", "Add", "To", "Set", "CreateHistogram", "FilterDatasets", "ImportFileCSV"]
