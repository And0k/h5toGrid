[project]
authors = [ {name = "Andrey Korzh", email = "ao.korzh@gmail.com"} ]
description = "Inclinometer metadata search and collect from existed data directories"
name = "absioras-meta_finder"
version = "0.1.0"
license = "MIT"
requires-python = ">= 3.11"
dependencies = ["ruamel-yaml>=0.19.1"]

[project.optional-dependencies]
test = ["pytest", "pytest-mock"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/meta_finder"]

[tool.pixi.pypi-dependencies]
# Подмодули автоматически доступны через workspace

[tool.hatch.envs.test]
dependencies = ["pytest"]

[tool.hatch.envs.test.scripts]
test = "pytest tests/"

[tool.ruff]
line-length = 110
