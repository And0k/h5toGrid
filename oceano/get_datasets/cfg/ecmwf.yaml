# ECMWF ERA5 specific configurations

ecmwf:
  dataset: "reanalysis-era5-single-levels"
  variables:
    - '10m_u_component_of_wind'
    - '10m_v_component_of_wind'
    - 'surface_pressure'
    - "sea_surface_temperature"
    - "total_precipitation"
    - '10m_wind_gust_since_previous_post_processing'
    - 'mean_wave_direction'
    - 'mean_wave_period'
    - 'peak_wave_period'
    - 'significant_height_of_combined_wind_waves_and_swell'
  product_types:
    product_type: ["reanalysis"]
  default_point: {lat: 54.99, lon: 20.3}
  default_date_range: ["2023-08-25", "2023-09-10"]
  data_format: "netcdf"
  download_format: "zip"
  output_subdir: "ECMWF" # Subdirectory within local_path for ECMWF data