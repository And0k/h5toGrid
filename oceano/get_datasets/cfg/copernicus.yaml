# Copernicus Marine Service (CMEMS) specific configurations

defaults:
  - _self_

copernicus:
  # API download settings for point data (used by download_copernicus_point.py, download_copernicus_points.py)
  point_wind:
    defaults:
      - projects: null # This will allow selecting a project config from the 'projects' directory
    dataset_id: "cmems_obs-wind_glo_phy_nrt_l4_0.125deg_PT1H"
    variables: ["eastward_wind", "northward_wind"]
    points:
      - {lat: 54.9896, lon: 20.299717}
      - {lat: 55.13533, lon: 19.76305}
    date_range: ["2024-06-25", "2024-09-05"] # Default date range for point wind downloads
    dir_save: "point_wind_data" # Suffix for the directory where point wind data will be saved

  # API download settings for region data (used by download_copernicus_region.py)
  region:
    defaults:
      - projects: null # This will allow selecting a project config from the 'projects' directory
    dataset_vars:
      cmems_mod_bal_phy_anfc_P1D-m: ["bottomT", "thetao", "so", "sob", "uo", "vo", "wo"]
      # cmems_obs-wind_glo_phy_my_l4_0.125deg_PT1H: ["eastward_wind", "northward_wind"]
    bbox:
      lat_min: 54.01
      lat_max: 58.99
      lon_min: 10.51
      lon_max: 21.32
    default_date_range: ["2023-09-15", "2024-02-10"]
    default_depth_min: 0.5
    default_depth_max: 125

  # FTP download settings (used by download_copernicus_ftp.py)
  ftp:
    dataset_info:
      name: "BAL_NRT_OBSERVATIONS_013_032" # Example: INSITU_BAL_NRT_OBSERVATIONS_013_032
      product: "INSITU_BAL_NRT_OBSERVATIONS_013_032" # Example: INSITU_BAL_NRT_OBSERVATIONS_013_032
      host: "nrt.cmems-du.eu"
      username: "your_cmems_ftp_username" # Placeholder, replace with actual username
      password: "your_cmems_ftp_password" # Placeholder, replace with actual password
    bbox:
      lat_min: 54.0
      lat_max: 56.0
      lon_min: 18.0
      lon_max: 22.0
    default_date_range: ["2023-01-01T00:00:00Z", "2023-01-02T00:00:00Z"]
    default_collection: "bal_multiparameter_nrt" # Example: bal_multiparameter_nrt
    parameters_filter: ["PSAL", "CNDC"] # Optional: filter by parameters

  netcdf_compression_level: 9