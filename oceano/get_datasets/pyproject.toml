[project]
description = "Download reanalysis data"
name = "absioras-get_datasets"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = [
"copernicusmarine"
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/get_datasets"]

[tool.pixi.pypi-dependencies]
# Подмодули автоматически доступны через workspace

[tool.hatch.envs.test]
dependencies = ["pytest"]

[tool.hatch.envs.test.scripts]
test = "pytest tests/"

[tool.ruff]
line-length = 110
