# Format validation rules per VNIIGMI-MCD
_format_rules:
  FC:  # Numeric format
    max_width: 15
    max_decimals: 7
    description: "Числовое поле с десятичной точкой"

  AA:  # Text format
    max_width: 255
    description: "Текстовое поле"

