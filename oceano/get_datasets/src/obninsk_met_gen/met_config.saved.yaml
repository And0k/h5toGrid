# =============================================================================
# MET File Generator Configuration
# =============================================================================
# Manual editing supported. Use only symbols supported in Windows-1251 encoding
# =============================================================================

# =============================================================================
# Input Data Directory Configuration
# =============================================================================
_input_path_history:
  _prompt: "Путь к данным"
  _description: "Каталог с файлами данных (*POS.csv и другие CSV файлы)"

# =============================================================================
# Section 1: *[Общие характеристики]
# =============================================================================
# Ключи этого раздела напрямую соответствуют заголовкам MET-файла
# При записи автоматически добавляются скобки: "[Наименование]" из ключа "Наименование"
# Section names without "_" prefix match MET file headers per VNIIGMI-MCD requirements

"Общие характеристики":
  "Наименование":
    _prompt: "Наименование комплекта данных"
