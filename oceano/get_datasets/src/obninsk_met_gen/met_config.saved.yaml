                  30.5}
              "Залив":
                "Гданьский залив":
                  bounds: {lat_min: 54.0, lat_max: 55.0, lon_min: 18.5, lon_max: 
                      20.5}
                "Вислинский залив":
                  bounds: {lat_min: 54.3, lat_max: 54.5, lon_min: 19.4, lon_max: 
                      20.0}
                "Финский залив":
                  bounds: {lat_min: 59.5, lat_max: 60.5, lon_min: 25.0, lon_max: 
                      30.0}
              "бассейн":
                "Борнхольмский бассейн":
                  bounds: {lat_min: 54.5, lat_max: 56.0, lon_min: 14.0, lon_max: 
                      16.5}
              "Пролив":
                "пролив Скагеррак":
                  bounds: {lat_min: 57.0, lat_max: 59.0, lon_min: 8.0, lon_max: 
                      12.0}

        "Северный Ледовитый":
          bounds: {lat_min: 60, lat_max: 90, lon_min: -180, lon_max: 180}
          "Море":
            "Баренцево":
              bounds: {lat_min: 66.0, lat_max: 82.0, lon_min: 16.0, lon_max: 
                  68.0}
            "Карское":
              bounds: {lat_min: 65.0, lat_max: 82.0, lon_min: 52.0, lon_max: 
                  100.0}

        "Тихий океан":
          bounds: {lat_min: -90, lat_max: 90, lon_min: 120, lon_max: -70}

  "Форма представления данных":
    _default: "Фактографическая – табличный текстовый формат"

  "Дата начала":
    _prompt: "Дата начала"
    _description: "Формат: ДД-ММ-ГГГГ (автоопределяется из файлов)"

  "Дата окончания":
    _prompt: "Дата окончания"
    _description: "Формат: ДД-ММ-ГГГГ (автоопределяется из файлов)"

  "Временное разрешение":
    _prompt: "Временное разрешение"
    _description: "Распределенfvие данных во времени"
    _options:
    - "нерегулярные файлы с регулярным содержимым"
    - "регулярные данные с интервалом 1 час"
    - "неравномерное"

  "Пространственное разрешение":
