        _description: "Фамилия Имя Отчество ответственного за подготовку комплекта
          данных"
      _email:
        _description: "Email для связи"
      _Телефон:
        _description: "Телефон для связи"
      _org_code: "090005"


# =============================================================================
# Section 2: *[Дополнительные сведения]
# =============================================================================
"Дополнительные сведения":
  "Приборы":
    _description: "Перечень приборов и устройств наблюдений, год выпуска, производитель"

  "Методы обработки":
    _prompt: "Методы обработки"
    _description: "Пример: Соленость рассчитана согласно формуле UNESCO. Координаты
      от GPS-приемника"
    _default: |
      Зависящие от электропроводности параметры (соленость, аномалия плотности, скорость звука) рассчитаны по
      формулам TEOS-10 используя библиотеку python GSW после коррекции в результате калибровки в лаборатории
      «АО ИО РАН». Координаты взяты на время начала зондирования от GPS-приемника

  "Привязка":
    _description: "Для данных в узлах сетки - координаты границ. Для станций - идентификаторы"

  "Полнота":
    _prompt: "Полнота"
    _description: "Пример: 100%"
    _default: "100%"

  "Объем":
    _description: "Объем данных в байтах и в подходящих структурных единицах (число
      файлов, станций)"

# =============================================================================
# INSTRUMENTS
# Hierarchy: _instruments -> _CTD -> specific device
# Parameters: short English names as keys, aliases for lookup
# =============================================================================
# Example:
#   Temp:
#     aliases: ['Temper', 'Temperature', 'температура']
#     #         ^short    ^other variants ^long (human-readable)
# lookup usage:
#   Column "temp" in CSV -> matches "Temp" key (case-insensitive)
#   aliases[-1]: long human description for MET file

_instruments:
  _CTD:  # instrument_type
    full_type_name: "гидрофизический зонд"
    observation_code: "H10"
    # Common parameter definitions (base library)
    # Used for inheritance when instrument has this parameter
    common_parameters:
      Pres:
        aliases: ['Pressure', 'давление', 'гидростатическое давление']
        unit: дБар
        range_default: 0..500
        accuracy_default: ±0.1%
      Temp:
        aliases: ['Temperature', 'температура']
        unit: °C
        range_default: -2..36
        accuracy_default: '0.005'
      Cond:
        aliases: ['Conductivity', 'электропроводность']
        unit: мСм/см
        range_default: 0..70
        accuracy_default: '0.003'
      Sal:
        aliases: ['Salinity', 'соленость']
        unit: ЕПС
        range_default: 0..42
        accuracy_default: '0.02'
        calculation_note: "рассчитывается по электропроводности, температуре, давлению"
      O2:
        aliases: ['O2%', 'насыщение кислородом']
        unit: '%'
        range_default: 0..500
        accuracy_default: '1'
      O2ppm:
        aliases: ['концентрация кислорода', 'содержание кислорода']
        unit: мг/л
        range_default: 0..50
        accuracy_default: '0.1'
      pH:
        aliases: ['водородный показатель']
        unit: ''
        range_default: 0..14
        accuracy_default: '0.01'
      Eh:
        aliases: ['eH', 'окислительно-восстановительный потенциал']
        unit: мВ
        range_default: -1000..1000
        accuracy_default: '1'
      CHL:
        aliases: ['Fluor', 'хлорофилл', 'хлорофилл-а']
        unit: мкг/л
        range_default: 0..100
        accuracy_default: '0.03'
      Turbidity:
        aliases: ['мутность']
        unit: ЕМФ
        range_default: 0..750
        accuracy_default: < 2%
      Transmittance:
        aliases: ['прозрачность']
        unit: '%'
        range_default: 0..100
        accuracy_default: '0.02'
      SigmaT:
        aliases: ['sigma0', 'sigmaT', 'sigma_t', 'аномалия плотности']
        unit: кг/м^3
        range_default: 0..35
        accuracy_default: '0.25%'
        calculation_note: "рассчитывается по температуре, солености и давлению"
      SigmaTh:
        aliases: ['sigma', 'SigmaTh', 'sigma_theta', 'аномалия потенциальной плотности']
        unit: кг/м^3
        range_default: 0..35
        accuracy_default: '0.25%'
        calculation_note: "рассчитывается по температуре, солености и давлению"
      soundV:
        aliases: ['скорость звука']
        unit: м/с
        range_default: 1400..1600
        accuracy_default: '0.1'
        calculation_note: "рассчитывается по формуле UNESCO"

    # Specific instruments
    # parameters: list of parameters THIS instrument has (others ignored!)
    # Can override properties from common_parameters
    "Sea&Sun Technology CTD 48M № 1253":
      folder_patterns: ["SST48", "SST_48", "CTD48M", "CTD_48m"]
      manufacturer: "Sea&Sun Technology, Германия"
      parameters:
        Pres:
          range: 0..2000
          accuracy: ±0.05%
        Temp:
          range: -2..36
          accuracy: ±0.005
        Cond:
          accuracy: ±0.003
        Sal:
          accuracy: ±0.01
    "Sea&Sun Technology CTD 90M № 81":
      folder_patterns: ["SST90", "SST_90", "CTD90M", "CTD_90M", "SeaSun"]
      manufacturer: "Sea&Sun Technology, Германия"
      year: 2004
      parameters:
        Pres:
          range: 0..500
          accuracy: ±0.1%
        Temp:
          range: -2..32
          accuracy: '0.005'
        Cond:
          accuracy: ±0.005
        Sal:
          accuracy: '0.02'
        Sigma: {}  # Calculated, inherits from common
        soundV: {}
    "SAIV SD208 № 1735":
      folder_patterns: ["SAIV", "SD208", "SAIV_SD208"]
      manufacturer: "SAIV A/S, Норвегия"
      parameters:
        Pres:
          range: 0..300
          accuracy: ±0.25%
        Temp:
          range: -5..35
          accuracy: ±0.003
        Cond: {}
        Sal:
          accuracy: ±0.1
        O2ppm: {}  # This instrument measures O2 in mg/l, not %
        CHL: {}
        Turbidity: {}
    "YSI Castaway CTD № CC1945007":
      folder_patterns: ["Castaway", "YSI_Castaway"]
      manufacturer: "YSI Inc., США"
      parameters:
        Pres:
          range: 0..300
          accuracy: ±0.25%
        Temp:
          range: -5..35
          accuracy: ±0.05
        Sal:
          accuracy: "±0.1"
    "Hydro-bios MWS 12 Slimline № 3613":
      folder_patterns: ["MWS12", "MWS_12"]
      manufacturer: "Hydro-bios, Германия"
      parameters:
        Pres:
          range: 0..3000
          accuracy: ±0.1%
        Temp:
          range: -2..32
          accuracy: ±0.005
        Cond:
          range: 0..65
          accuracy: ±0.01

