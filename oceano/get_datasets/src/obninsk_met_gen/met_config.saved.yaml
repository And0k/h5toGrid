    _default: "Использован словарь параметров ЕСИМО"

  "Файловая структура":
    _description: "Файловый состав комплекта обмена"

  "Источник":
    _default: "{organization}, {cruise}"
    _prompt: "Название экспедиции, тип и название наблюдательной платформы"
    _description: 'Пример: ФГБУН «АО ИО РАН», НИС "Академик Борис Петров", рейс 64'

  "Выходные реквизиты":
    _default: "{organization}"
    _description: "Организация-изготовитель комплекта данных"
    "ФГБУН «АО ИО РАН»":
