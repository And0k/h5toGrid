    _description: "Распределение данных по пространству"
    _options:
    - "данные по отдельным станциям"
    - "регулярная сетка 1 градус"

  "Упорядочение":
    _prompt: "Упорядочение"
    _description: "Пример: Данные упорядочены по возрастанию номера станции, времени
