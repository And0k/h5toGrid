[project]
authors = [ {name = "Andrey Korzh", email = "ao.korzh@gmail.com"} ]
description = "Process ADCP data"
name = "absioras-adcp"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/adcp"]

[tool.pixi.pypi-dependencies]
absioras-adcp = { path = ".", editable = true }

[tool.hatch.envs.test]
dependencies = ["pytest"]

[tool.hatch.envs.test.scripts]
test = "pytest tests/"

[tool.ruff]
line-length = 110
