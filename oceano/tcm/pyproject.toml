[project]
authors = [ {name = "Andrey Korzh", email = "ao.korzh@gmail.com"} ]
description = "Convert raw data files measured by AB SIO RAS tilt current meters (TCM) to csv and NetCDF data files with physical units optionally with filtering/averaging: CLI and its GUI with Live Progress"
license = "MIT"
name = "absioras-tcm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
"hydra-colorlog>=1.2",
"ruamel-yaml>=0.19.1",
"absioras-utils"
]

[project.optional-dependencies]
full = [
  "h5py",
  "netcdf4",
  "numba",
  "scipy",
  "matplotlib"
]
noh5 = [
  "pyinstaller",
  "pyinstaller-hooks-contrib"
]
test = ["pytest"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/tcm", "src/tcm_gui"]

[tool.pixi.pypi-dependencies]
# Подмодули автоматически доступны через workspace

[tool.hatch.envs.test]
dependencies = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not clipboard"'
markers = [
    "xr: tests for the xarray pipeline (tests/_xr/)",
    "gui: tests for tcm_gui (tests/_tcm_gui/)",
    "calibration: tests for calibration math (tests/_calibration/)",
    "comparison: cross-pipeline validation",
    "clipboard: writes the REAL OS clipboard (pollutes clipboard-manager history); deselected by default, run explicitly with -m clipboard",
]

[tool.ruff]
line-length = 110
target-version = "py312"
builtins = ["SetData", "SetData2D", "SetDataExpression", "SetData2DExpressionXYZ", "SetData2DXYFunc", "AddCustom", "DatasetPlugin", "TagDatasets", "Add", "To", "Set", "CreateHistogram", "FilterDatasets", "ImportFileCSV"]
