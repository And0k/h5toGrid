# Default configuration for spectr_clc module
# Used when spectr_clc.main() is called programmatically
# Command-line arguments will override these values

in:
  db_path: null  # Path to HDF5 store with input data
  tables_list: "w.*"  # Table names pattern (regexp)
  chunksize_int: 50000  # Limit loading data in memory
  min_date: "2019-01-01T00:00:00"  # Minimum date to use
  min_Pressure: -1e15  # Minimum pressure value (filter out NaNs)
  max_Pressure: null  # Maximum pressure value
  fs_float: null  # Sampling frequency in Hz (null = determine from data)

filter:
  min_dict: null  # List of key:value pairs for minimum filtering
  max_dict: null  # List of key:value pairs for maximum filtering

out:
  db_path: null  # Path to output HDF5 store
  table: "psd"  # Table name for output

proc:
  # Overlap ratio between consecutive intervals [0, 1).
  # 0 = no overlap, 0.5 = 50% overlap (intervals overlap by half of dt_interval_minutes).
  # The actual overlap in minutes is: overlap_float * dt_interval_minutes.
  overlap_float: 0.5
  time_intervals_center_list: null  # List of interval centers (if not using split_period)
  dt_interval_hours: null  # Time interval in hours (overrides dt_interval_minutes if set)
  # Length of each interval in minutes.
  # This is the duration of data used for each spectral calculation.
  # For example, 60 means each spectrum is calculated from 60 minutes of data.
  dt_interval_minutes: 60
  fmin_float: 0.04  # Minimum output frequency (Hz)
  fmax_float: 0.5  # Maximum output frequency (Hz)
  calc_version: "trigonometric(incl)"  # Processing variant
  max_incl_of_fit_deg_float: null  # Maximum inclination for fit (degrees)

program:
  return: "<end>"  # Return behavior: <end>, <return_cfg>, <return_cfg_with_options>
  b_interact: 0  # Ask user before processing (0=no, 1=yes)
  verbose: "INFO"  # Logging verbosity: CRITICAL, ERROR, WARNING, INFO, DEBUG, NOTSET
  log: null  # Log file path (null = default)
