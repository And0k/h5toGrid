# @package hydra.job_logging
version: 1
formatters:
  colorlog:
    '()': 'colorlog.ColoredFormatter'
    format: '%(cyan)s%(asctime)s%(reset)s|%(blue)s%(funcName)s%(reset)s|%(log_color)s%(message)s'
    datefmt: '%H:%M:%S'
    log_colors:
      DEBUG: purple
      INFO: green
      WARNING: yellow
      ERROR: red
      CRITICAL: red
filters:
  stage_ctx:
    (): tcm.stage_ctx.StageContextFilter
handlers:
  console:
    class: logging.StreamHandler
    formatter: colorlog
    stream: ext://sys.stdout
    level: INFO
    filters: [stage_ctx]

loggers:
  matplotlib:  # Suppress matplotlib debug messages
    level: WARNING
    handlers: [console]
    propagate: false
  h5py._conv:  # Suppress
    level: WARNING
    propagate: false
  numba.core:
    level: WARNING
    propagate: true
  flox:
    level: WARNING
root:
  level: DEBUG
  handlers: [console]

disable_existing_loggers: false
