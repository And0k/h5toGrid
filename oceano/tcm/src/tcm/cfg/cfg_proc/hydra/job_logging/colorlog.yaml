# @package hydra.job_logging
version: 1
formatters:
  colorlog:
    # utils factory = colorlog colouring + SafeStringFormatter options:
    # 'tcm.' prefix stripped from names, module.funcName:row shown,
    # VSCode-clickable tracebacks, caller>callee for same-module calls
    # (the latter two also need CustomLogger — installed by tcm.cli._setup_file_handler
    # via utils.logging_config.upgrade_loggers, since dictConfig can't set logger classes)
    '()': utils.logging_config.colored_formatter
    fmt: '%(cyan)s%(asctime)s%(reset)s|%(blue)s%(name)s.%(funcName)s:%(lineno)d%(reset)s|%(log_color)s%(message)s'
    datefmt: '%H:%M:%S'
    package_prefix: 'tcm.'
    caller_callee: true
    log_colors:
      DEBUG: purple
      INFO: green
      WARNING: yellow
      ERROR: red
      CRITICAL: red
filters:
  stage_ctx:
    (): tcm.stage_ctx.StageContextFilter
handlers:
  console:
    class: logging.StreamHandler
    formatter: colorlog
    stream: ext://sys.stdout
    level: INFO
    filters: [stage_ctx]

loggers:
  matplotlib:  # Suppress matplotlib debug messages
    level: WARNING
    handlers: [console]
    propagate: false
  h5py._conv:  # Suppress
    level: WARNING
    propagate: false
  numba.core:
    level: WARNING
    propagate: true
  flox:
    level: WARNING
root:
  level: DEBUG
  handlers: [console]

disable_existing_loggers: false
