# @package hydra.job_logging
version: 1
formatters:
  simple:
    format: '%(asctime)s|%(name)s|%(levelname)s|%(message)s'
    datefmt: '%H:%M:%S'
  colorlog:
    '()': 'colorlog.ColoredFormatter'
    format: '%(cyan)s%(asctime)s%(reset)s|%(blue)s%(funcName)s%(reset)s|%(log_color)s%(message)s'
    datefmt: '%H:%M:%S'
    log_colors:
      DEBUG: purple
      INFO: green
      WARNING: yellow
      ERROR: red
      CRITICAL: red
handlers:
  console:
    class: logging.StreamHandler
    formatter: colorlog
    stream: ext://sys.stdout
    level: INFO
  file:
    class: logging.FileHandler
    formatter: simple
    filename: ${hydra.run.dir}/${hydra.job.name}.log
    encoding: utf-8  # Bypasses locale.getpreferredencoding()

loggers:
  matplotlib:  # Suppress matplotlib debug messages
    level: WARNING
    handlers: [console, file]
    propagate: false
  h5py._conv:  # Suppress
    level: WARNING
    propagate: false
  numba.core:
    level: WARNING
    propagate: true
  flox:
    level: WARNING
root:
  level: DEBUG
  handlers: [console, file]

disable_existing_loggers: false
