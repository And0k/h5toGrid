# Chrome help content (i18n substitution point).
# Stable string keys for chrome widgets (everything that is NOT a config cell).
# At build for another language, replace this file wholesale with the same keys
# → localized strings; App auto-registration (_register_chrome_help) then
# reads already-translated values at startup.  Config-cell help comes from a
# different source (config_reference.md) and is resolved by _help.py.
#
# Color markup: {#name}text{/} — name is a key in theme.TAG_COLORS,
# resolved by MarkdownLabel's color map at render time.
# For strings that use .format(), escape as {{#name}}text{{/}}.

# ── Chrome widget tooltips / hover status ─────────────────────────────────
path_lbl.tooltip: "Data search path"
path_field.tooltip: "Data search path"
path_field.status: "Changing data path rescans and **resets all config tabs below**"
overall_lbl.status: "Current configuration state"
run.tooltip: "Run button"
run.start: "Start processing"
run.pause: "Pause processing"
run.resume: "Resume processing"
status_lbl.status: "Application status messages"
nb.status: "Configuration tabs — one per data file / deployment"
# keep chrome status strings single-paragraph as _fit_status_font() caps the label to one row
log.status: "Processing log — color-coded by severity ({#debug}debug{/}/{#info}info{/}/{#warning}warning{/}/{#error}error{/})"
prog_all.status: "Overall progress across all configurations"
prog_stage.status: "Current stage progress within the active configuration"
tab.status: "Configuration: `{path}`"  # template — _add_page formats {path}
browse_btn.status: "Hold **Shift** to select files instead of directory"
empty_area.synced: "Editable — coefs, dates, path **sync to YAML on Run**"
empty_area.unsaved: "No YAML config — provide a data path above to generate configs that persist edits"

# ── Button labels ─────────────────────────────────────────────────────────
run_btn.text: "Run"
run_btn.pause: "Pause"
run_btn.resume: "Resume"

# ── Status / progress text ────────────────────────────────────────────────
status.ready: "Ready"
status.loading: "Loading\u2026"
status.starting: "Starting\u2026"

# ── Completion template (format: pct, ok, n) ──────────────────────────────
overall_lbl.done_detail: " - Done {pct}% ({ok}/{n} ok)"

# ── Error prefixes (log queue) ────────────────────────────────────────────
error.scan: "Scan: {p}"
error.run: "Run: {p}"
