[project]
authors = [ {name = "Andrey Korzh", email = "ao.korzh@gmail.com"} ]
description = "Automatic selection of data files, data parts to load, and Veusz display pattens  based on file path/name of veusz files, directory sturcture and existed data files there"
name = "absioras-veusz_helpers"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/veusz_helpers"]

[tool.pixi.pypi-dependencies]
# Подмодули автоматически доступны через workspace

[tool.hatch.envs.test]
dependencies = ["pytest"]

[tool.hatch.envs.test.scripts]
test = "pytest tests/"

[tool.ruff]
line-length = 110
